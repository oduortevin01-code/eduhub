<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Profile — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="profile" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header">
    <h1>👤 Profile</h1>
  </div>

  <div class="form-card" style="text-align:center;">
    <div class="avatar-circle" id="profileAvatar" style="width:64px; height:64px; font-size:22px; margin:0 auto 14px;">Z</div>
    <h2 id="profileName" style="font-family:var(--font-display); font-size:18px; color:var(--navy-800);">Student</h2>
    <p id="profileEmail" style="color:#7a86a8; font-size:13px; margin-top:4px;">—</p>
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid #f0f2fa;">
      <div style="font-size:12px; color:#7a86a8; font-weight:600;">LEVEL</div>
      <div id="profileLevel" style="font-size:15px; color:var(--navy-800); font-weight:600; margin-top:2px;">—</div>
    </div>
  </div>
</div>

<script src="../app.js"></script>
</body>
</html>
