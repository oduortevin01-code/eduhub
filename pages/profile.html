<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Profile — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1a3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">
</head><body data-page="profile"><div id="chrome"></div><main class="page-body">
<div class="page-header"><h1>👤 Profile</h1></div>
<div class="card" style="text-align:center"><div class="avatar" id="profileAvatar">Z</div><h2 id="profileName">Student</h2><p id="profileEmail" style="color:var(--muted)">—</p><span class="badge" id="profileLevel">Education level not set</span></div>
<h2 class="section-title">📊 My Learning</h2><div class="stat-grid"><div class="stat"><strong>0</strong><span>Lessons</span></div><div class="stat"><strong>0</strong><span>Quizzes</span></div><div class="stat"><strong>0</strong><span>Exams</span></div></div>
<div class="card"><b>Overall Progress</b><div class="progress" style="margin-top:10px"><i style="width:0%"></i></div><p style="font-size:12px;color:var(--muted)">Progress will update from real learning activity.</p></div>
<h2 class="section-title">💾 My Content</h2><div class="grid"><div class="feature-card">📘 Saved Notes</div><div class="feature-card">📄 Saved Papers</div><div class="feature-card">⭐ Bookmarks</div><div class="feature-card">💬 Chat History</div></div>
</main><script src="../app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body></html>
