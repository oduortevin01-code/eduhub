<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scan a Question — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="scanner" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header">
    <h1>📷 Scan a Question</h1>
    <p>Take or upload a photo of a question, diagram, or your handwritten work — Zimora reads it and explains the answer.</p>
  </div>

  <div class="scan-drop">
    <span class="emoji">📷</span>
    <h3>Take or choose a photo</h3>
    <p>Works best with good lighting and a clear, straight-on shot.</p>
    <button class="btn-primary" id="scanBtn" style="max-width:220px; margin:0 auto;">Open Camera / Gallery</button>
  </div>
  <input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none;">

  <div id="scanPreview" style="padding:0 18px;"></div>
  <div id="scanResult" style="display:none; padding:0 18px; margin-top:12px;"></div>
</div>

<script src="../app.js"></script>
</body>
</html>
