</head><body data-page="scanner"><div id="chrome"></div><main class="page-body">
<div class="page-header"><h1>📷 Scan a Question</h1><p>Take or upload a question, diagram or handwritten work and let Zimora help you understand it.</p></div>
<div class="scan-drop"><span class="emoji">📷</span><h3>Take or choose a photo</h3><p>Use your camera or select an image from your phone.</p><div class="btn-row"><button class="btn-primary" id="scanBtn">📸 Take / Choose Photo</button><button class="btn-secondary" onclick="document.getElementById('scanInput').click()">🖼️ Gallery</button></div></div>
<input id="scanInput" type="file" accept="image/*" capture="environment" style="display:none"><div id="scanPreview"></div><div id="scanResult"></div>
