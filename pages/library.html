<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Study Library — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="library" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header">
    <h1>📚 Study Library</h1>
    <p>Upload your own notes and Zimora will teach and quiz you straight from them.</p>
  </div>

  <div class="library-upload-card">
    <span style="font-size:34px; display:block; margin-bottom:10px;">📄</span>
    <h3 style="font-family:var(--font-display); font-size:15px; color:var(--navy-800); margin-bottom:8px;">Upload a PDF, DOCX, or TXT file</h3>
    <button class="btn-primary" id="libraryUploadBtn" style="max-width:220px; margin:0 auto;">Choose File</button>
    <div class="library-status" id="libraryStatus"></div>
  </div>
  <input type="file" id="libraryFileInput" accept=".pdf,.doc,.docx,.txt" style="display:none;">
</div>

<script src="../app.js"></script>
</body>
</html>
