<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="settings" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header"><h1>⚙️ Settings</h1></div>
  <div style="padding:0 18px;">
    <div class="settings-row">
      <div><div class="sr-label">Push notifications</div><div class="sr-desc">Reminders and updates</div></div>
      <button class="toggle on" data-toggle></button>
    </div>
    <div class="settings-row">
      <div><div class="sr-label">Dark mode</div><div class="sr-desc">Easier on the eyes at night</div></div>
      <button class="toggle" data-toggle></button>
    </div>
    <div class="settings-row">
      <div><div class="sr-label">Data saver</div><div class="sr-desc">Reduce video quality on mobile data</div></div>
      <button class="toggle" data-toggle></button>
    </div>
    <div class="settings-row">
      <div><div class="sr-label">Sound effects</div><div class="sr-desc">Quiz feedback sounds</div></div>
      <button class="toggle on" data-toggle></button>
    </div>
  </div>
</div>

<script src="../app.js"></script>
</body>
</html>
