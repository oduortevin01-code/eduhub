<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1a3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../style.css">
</head><body data-page="settings"><div id="chrome"></div><main class="page-body">
<div class="page-header"><h1>⚙️ Settings</h1><p>Control your Zimora experience.</p></div><div class="card">
<div class="settings-row"><div><div class="sr-label">Push notifications</div><div class="sr-desc">Reminders and updates</div></div><button class="toggle on" data-toggle></button></div>
<div class="settings-row"><div><div class="sr-label">Dark mode</div><div class="sr-desc">Easier on the eyes at night</div></div><button class="toggle" data-toggle></button></div>
<div class="settings-row"><div><div class="sr-label">Data saver</div><div class="sr-desc">Reduce video quality on mobile data</div></div><button class="toggle" data-toggle></button></div>
<div class="settings-row"><div><div class="sr-label">Sound effects</div><div class="sr-desc">Quiz feedback sounds</div></div><button class="toggle on" data-toggle></button></div>
</div>
<h2 class="section-title">🎙️ Voice & AI</h2><div class="card"><div class="field"><label>Speaking speed</label><select><option>Normal</option><option>Slow</option><option>Fast</option></select></div><div class="field"><label>Auto-play explanations</label><select><option>On</option><option>Off</option></select></div></div>
<h2 class="section-title">📚 Learning preferences</h2><div class="card"><div class="field"><label>Education level</label><select><option>Not set</option><option>Primary</option><option>Junior Secondary</option><option>Senior Secondary</option><option>University</option></select></div><div class="field"><label>Curriculum</label><select><option>Kenyan Curriculum</option><option>Cambridge</option><option>Other</option></select></div></div>
</main><script src="../app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body></html>
