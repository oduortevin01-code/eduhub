</head><body data-page="papers"><div id="chrome"></div><main class="page-body">
<div class="page-header"><h1>📄 Past Papers & Mock Exams</h1><p>Practice with available papers or generate a fresh AI mock paper.</p></div>
<div class="grid"><div class="feature-card"><span class="emoji">📚</span><strong>Past Papers</strong><span>Browse authorized papers when connected to your archive.</span></div><div class="feature-card"><span class="emoji">🤖</span><strong>AI Mock Paper</strong><span>Create a new practice paper.</span></div></div>
<form id="papersForm" class="form-card"><div class="field"><label>Education level</label><select><option>Primary</option><option>Junior Secondary</option><option>Senior Secondary</option><option>University</option></select></div><div class="field"><label>Curriculum / Exam</label><select><option>Kenyan Curriculum</option><option>Cambridge</option></select></div><div class="field"><label>Subject</label><input id="papersSubject" placeholder="e.g. Chemistry" required></div><div class="field"><label>Topic (optional)</label><input id="papersTopic" placeholder="Leave blank for a general paper"></div><div class="field"><label>Year (optional)</label><select><option>All Years</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option></select></div><button class="btn-primary" id="papersGenBtn">🤖 Generate AI Mock Paper</button></form><div id="papersResult" style="display:none"></div>
</main><script src="../app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body></html>
