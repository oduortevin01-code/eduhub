<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Past Papers — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="papers" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header">
    <h1>📄 Past Papers</h1>
    <p>Zimora doesn't have a real past-papers archive yet — instead it generates a fresh, exam-style mock paper with a full marking scheme, tailored to your level.</p>
  </div>

  <form id="papersForm" class="form-card">
    <div class="field">
      <label for="papersSubject">Subject</label>
      <input type="text" id="papersSubject" placeholder="e.g. Chemistry" required>
    </div>
    <div class="field">
      <label for="papersTopic">Topic (optional)</label>
      <input type="text" id="papersTopic" placeholder="Leave blank for a general paper">
    </div>
    <button type="submit" class="btn-primary" id="papersGenBtn">Generate Paper</button>
  </form>

  <div id="papersResult" style="display:none;"></div>
</div>

<script src="../app.js"></script>
</body>
</html>
