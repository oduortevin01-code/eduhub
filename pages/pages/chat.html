<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ask Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="chat" class="chat-shell">
<div id="chrome"></div>

<div class="chat-page-body">
  <div class="notes-pill" id="notesPill" style="display:none;">
    <span id="notesPillText">📄 Studying: —</span>
    <button id="notesPillClear" aria-label="Stop studying this file">✕</button>
  </div>
  <div style="padding:8px 14px 0; text-align:right;">
    <button class="chat-icon-btn" id="newChatBtn" style="background:#eef2fb;">🔄 New Chat</button>
  </div>

  <div id="chatWelcome" class="chat-welcome">
    <div class="welcome-avatar">🤖</div>
    <h2>Hi, <span id="welcomeName">there</span>! 👋</h2>
    <p>Ask me anything about your studies. I can explain topics, solve questions, create quizzes, make revision notes, and more.</p>
    <div class="suggest-grid">
      <button class="suggest-card" data-prompt="Explain this topic simply: "><span class="emoji">💡</span><strong>Explain simply</strong><span>Understand tricky topics</span></button>
      <button class="suggest-card" data-prompt="Give me an example of: "><span class="emoji">📝</span><strong>Give an example</strong><span>Learn with practice</span></button>
      <button class="suggest-card" data-prompt="Quiz me on: "><span class="emoji">🧠</span><strong>Quiz me</strong><span>Test my understanding</span></button>
      <button class="suggest-card" data-prompt="Give me an assignment on: "><span class="emoji">📚</span><strong>Assignment</strong><span>Practise a topic</span></button>
      <button class="suggest-card" data-prompt="Summarize this for me: "><span class="emoji">✨</span><strong>Summarize</strong><span>Get the key points</span></button>
      <button class="suggest-card" data-prompt="Make revision notes on: "><span class="emoji">📖</span><strong>Revision notes</strong><span>Study-ready notes</span></button>
    </div>
  </div>

  <div id="chat"></div>
  <div class="chat-input-area">
    <button class="chat-icon-btn" id="attachBtn" aria-label="Attach photo, file or video">📎</button>
    <textarea id="prompt" rows="1" placeholder="Ask Zimora anything…"></textarea>
    <button class="chat-icon-btn" id="micBtn" aria-label="Voice input">🎤</button>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
  <div class="voice-mode-bar" id="voiceModeBar" style="display:none;">
    🎙️ Voice Mode is ON — replies are read aloud automatically
    <button id="voiceModeOffBtn">Turn off</button>
  </div>
</div>

<!-- Upload sheet -->
<div class="sheet-backdrop" id="uploadBackdrop"></div>
<div class="sheet" id="uploadSheet">
  <div class="sheet-handle"></div>
  <h3>Add to Zimora</h3>
  <button class="sheet-option" data-pick="image">
    <span class="icon-circle">🖼️</span>
    <span class="opt-text"><strong>Photo</strong><span>Scan a question or diagram</span></span>
  </button>
  <button class="sheet-option" data-pick="file">
    <span class="icon-circle">📄</span>
    <span class="opt-text"><strong>File</strong><span>PDF, Word, or notes</span></span>
  </button>
  <button class="sheet-option" data-pick="video">
    <span class="icon-circle">🎥</span>
    <span class="opt-text"><strong>Video</strong><span>Upload a video clip</span></span>
  </button>
</div>
<input type="file" id="fileImage" accept="image/*">
<input type="file" id="fileDoc" accept=".pdf,.doc,.docx,.txt">
<input type="file" id="fileVideo" accept="video/*">

<script src="../app.js"></script>
</body>
    </html>
