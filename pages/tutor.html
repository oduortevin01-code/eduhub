<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zimora Tutor</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1a3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="tutor" class="page-shell">
<div id="chrome"></div>
<main class="page-body" style="padding-left:0;padding-right:0">

  <div id="lessonLoading" class="loading-lesson">🤖 Zimora is preparing your lesson…</div>

  <div id="zimoraLesson" style="display:none">
    <section class="lesson-hero">
      <span>🤖 ZIMORA LESSON</span>
      <h1 id="lessonTitle"></h1>
      <p id="lessonIntroduction"></p>
    </section>

    <section class="lesson-section">
      <h2>📖 Let's Understand It</h2>
      <p id="lessonExplanation"></p>
    </section>

    <section class="lesson-section">
      <h2>✨ Key Points</h2>
      <div id="keyPoints"></div>
    </section>

    <section class="lesson-section">
      <h2>💡 Example</h2>
      <p id="lessonExample"></p>
    </section>

    <section class="lesson-section">
      <div class="visual-heading">
        <div>👁️</div>
        <div><h2 id="visualTitle" style="margin:0 0 4px">Visual Learning</h2><p id="visualDescription" style="color:var(--muted);font-size:12.5px"></p></div>
      </div>
      <div id="visualContent" class="visual-content"></div>
    </section>

    <section class="next-step">
      <b>🤖 Zimora asks</b>
      <p id="nextStepQuestion" style="margin-top:6px"></p>
    </section>

    <section class="lesson-section">
      <h2>🧠 Quick Check</h2>
      <h3 id="quizQuestion" style="font-size:13.5px;color:var(--navy-800)"></h3>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizFeedback" class="feedback" style="display:none"></div>
    </section>

    <div class="lesson-actions">
      <button class="btn-secondary" id="speakLessonBtn">🔊 Read to Me</button>
      <button class="btn-primary" id="continueLessonBtn">Continue Learning →</button>
    </div>
  </div>

</main>
<script src="../app.js"></script>
</body>
</html>
