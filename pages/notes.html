<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="notes" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div class="page-header">
    <h1>📘 Notes</h1>
    <p>Get exam-focused notes on any topic, with diagrams and a video where helpful.</p>
  </div>

  <form id="notesForm" class="form-card">
    <div class="field">
      <label for="notesTopic">Topic</label>
      <input type="text" id="notesTopic" placeholder="e.g. Photosynthesis" required>
    </div>
    <button type="submit" class="btn-primary" id="notesGenBtn">Generate Notes</button>
  </form>

  <div id="notesResult" style="display:none;"></div>
</div>

<script src="../app.js"></script>
</body>
</html>
