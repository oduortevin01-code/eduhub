<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1a3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head><body data-page="notes"><div id="chrome"></div><main class="page-body">
<div class="page-header"><h1>📘 Notes</h1><p>Learn any topic with clear explanations, diagrams, examples and exam-focused revision.</p></div>
<form id="notesForm" class="form-card">
<div class="field"><label>Education level</label><select><option>Primary</option><option>Junior Secondary</option><option>Senior Secondary</option><option>University</option></select></div>
<div class="field"><label>Curriculum</label><select><option>Kenyan Curriculum</option><option>Cambridge</option><option>Other</option></select></div>
<div class="field"><label>Subject</label><input placeholder="e.g. Biology"></div>
<div class="field"><label>Topic</label><input id="notesTopic" placeholder="e.g. Photosynthesis" required></div>
<div class="field"><label>Note type</label><select><option>Detailed Notes</option><option>Quick Revision</option><option>Exam-Focused</option><option>Simple Explanation</option></select></div>
<button class="btn-primary" id="notesGenBtn">Generate Notes</button></form>
<div id="notesResult" style="display:none"></div>
</main><script src="../app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body></html>
