<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Exam Coach — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="exam" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div id="examSetup">
    <div class="page-header">
      <h1>🎯 Exam Coach</h1>
      <p>Get a real, interactive exam — answer, get marked instantly, and see what to revise.</p>
    </div>
    <div class="form-card">
      <div class="field">
        <label for="examSubject">Subject</label>
        <input type="text" id="examSubject" placeholder="e.g. Biology">
      </div>
      <div class="field">
        <label for="examTopic">Topic</label>
        <input type="text" id="examTopic" placeholder="e.g. Photosynthesis">
      </div>
      <div class="field">
        <label for="examDifficulty">Difficulty</label>
        <select id="examDifficulty">
          <option>Easy</option>
          <option selected>Medium</option>
          <option>Hard</option>
        </select>
      </div>
      <div class="field">
        <label for="examCount">Number of questions</label>
        <select id="examCount">
          <option>5</option>
          <option selected>10</option>
          <option>15</option>
        </select>
      </div>
      <button class="btn-primary" id="examStartBtn">Generate Exam</button>
      <div class="auth-msg" id="examSetupMsg"></div>
    </div>
  </div>
  <div id="examQuizArea" style="display:none;"></div>
</div>

<script src="../app.js"></script>
</body>
</html>
