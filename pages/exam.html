<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Exam — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1a3f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head><body data-page="exam"><div id="chrome"></div><main class="page-body">
<div id="examSetup"><div class="page-header"><h1>🎯 Exam Coach</h1><p>Create a personalized practice exam and discover what you need to improve.</p></div>
<div class="form-card">
<div class="field"><label>Education level</label><select><option>Primary</option><option>Junior Secondary</option><option>Senior Secondary</option><option>University</option></select></div>
<div class="field"><label>Curriculum</label><select><option>Kenyan Curriculum</option><option>Cambridge</option></select></div>
<div class="field"><label>Subject</label><input id="examSubject" placeholder="e.g. Biology"></div>
<div class="field"><label>Topic</label><input id="examTopic" placeholder="e.g. Photosynthesis or All Topics"></div>
<div class="field"><label>Difficulty</label><select id="examDifficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Mixed</option></select></div>
<div class="field"><label>Number of questions</label><select id="examCount"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></div>
<div class="field"><label>Question type</label><select><option>Mixed</option><option>Multiple Choice</option><option>Short Answer</option><option>True/False</option></select></div>
<div class="field"><label>Time limit</label><select><option>No limit</option><option>10 minutes</option><option>20 minutes</option><option>30 minutes</option></select></div>
<div id="examSetupMsg" class="auth-msg"></div>
<button class="btn-primary" id="examStartBtn">🚀 Generate Exam</button></div></div>
<div id="examQuizArea" style="display:none"></div>
</main><script src="../app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body></html>
