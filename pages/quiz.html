<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quick Quiz — Zimora</title>
<link rel="icon" type="image/png" href="../zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body data-page="quiz" class="page-shell">
<div id="chrome"></div>

<div class="page-body">
  <div id="quizPicker">
    <div class="page-header">
      <h1>🧠 Quick Quiz</h1>
      <p>Pick a subject for an instant 5-question quiz.</p>
    </div>
    <div class="subject-grid">
      <button class="subject-card quiz-start" data-subject="Mathematics"><span class="emoji">➗</span><span class="label">Mathematics</span></button>
      <button class="subject-card quiz-start" data-subject="Biology"><span class="emoji">🧬</span><span class="label">Biology</span></button>
      <button class="subject-card quiz-start" data-subject="Chemistry"><span class="emoji">⚗️</span><span class="label">Chemistry</span></button>
      <button class="subject-card quiz-start" data-subject="Physics"><span class="emoji">🔭</span><span class="label">Physics</span></button>
      <button class="subject-card quiz-start" data-subject="English"><span class="emoji">📖</span><span class="label">English</span></button>
      <button class="subject-card quiz-start" data-subject="Geography"><span class="emoji">🌍</span><span class="label">Geography</span></button>
    </div>
    <div class="auth-msg" id="quizMsg" style="margin:12px 18px 0;"></div>
  </div>
  <div id="quizArea" style="display:none;"></div>
</div>

<script src="../app.js"></script>
</body>
</html>
