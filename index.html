<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Eduhub AI Tutor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root{--purple:#7c3aed;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.header{padding:16px;background:var(--card);border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:85%;margin:12px 0;padding:12px 16px;border-radius:16px;line-height:1.6;word-wrap:break-word}
.user{background:var(--purple);margin-left:auto;border-bottom-right-radius:4px}
.ai{background:var(--card);border-bottom-left-radius:4px}
.ai h1,.ai h2,.ai h3{margin:12px 0 8px;color:#c4b5fd}
.ai ul{margin:8px 0 8px 20px}
.ai strong{color:#c4b5fd}
.input-area{padding:12px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:end}
#prompt{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);resize:none;max-height:120px}
button{padding:12px 16px;border:none;border-radius:12px;background:var(--purple);color:white;font-weight:600;cursor:pointer}
button:disabled{opacity:0.5}
.mermaid{background:#0f172a;padding:12px;border-radius:8px;margin:8px 0}
.video-wrap{margin:12px 0;border-radius:12px;overflow:hidden;background:#000}
.video-header{padding:8px 12px;background:var(--purple);color:white;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <span>🎓 Eduhub AI Tutor</span>
  <button onclick="reset()" style="padding:6px 12px;font-size:12px">New Chat</button>
</div>
<div id="chat"></div>
<div class="input-area">
  <textarea id="prompt" rows="1" placeholder="Ask Math, Biology, French... or say 'show video on water cycle'"></textarea>
  <button onclick="startVoice()" id="micBtn">🎤</button>
  <button onclick="sendMsg()" id="sendBtn">Send</button>
</div>

<script>
mermaid.initialize({startOnLoad:false,theme:'dark'});
let history = [];
const eduName = localStorage.getItem('eduName') || prompt('Your name?') || 'Student';
const eduLevel = localStorage.getItem('eduLevel') || prompt('Level: Primary / Secondary / University?') || 'Secondary';
const eduClass = localStorage.getItem('eduClass') || prompt('Class or Form? e.g. Form 3, Grade 6, Year 2') || 'Form 3';
localStorage.setItem('eduName',eduName);localStorage.setItem('eduLevel',eduLevel);localStorage.setItem('eduClass',eduClass);

function addMsg(text,who){
  const chat=document.getElementById('chat');
  const msg=document.createElement('div');
  msg.className='msg '+who;
  
  // Convert [YOUTUBE_SEARCH:topic] to hidden Eduhub video player
  text = text.replace(/\[YOUTUBE_SEARCH:(.*?)\]/g,(m,q)=>{
    const s=encodeURIComponent(q+' cartoon explanation for students');
    return `<div class="video-wrap"><div class="video-header">🎬 Eduhub Explanation Video</div><iframe width="100%" height="200" src="https://www.youtube.com/embed?listType=search&list=${s}&modestbranding=1&rel=0&showinfo=0" frameborder="0" allowfullscreen></iframe></div>`;
  });
  
  msg.innerHTML=marked.parse(text);
  chat.appendChild(msg);
  
  // Render LaTeX math
  renderMathInElement(msg,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});
  
  // Render Mermaid diagrams
  if(msg.innerHTML.includes('```mermaid')){
    msg.innerHTML=msg.innerHTML.replace(/```mermaid([\s\S]*?)```/g,'<div class="mermaid">$1</div>');
    mermaid.init(undefined,msg.querySelectorAll('.mermaid'));
  }
  
  // Render raw SVG diagrams
  if(msg.innerHTML.includes('```svg')){
    msg.innerHTML=msg.innerHTML.replace(/```svg([\s\S]*?)```/g,'$1');
  }
  
  chat.scrollTop=chat.scrollHeight;
}

async function sendMsg(){
  const p=document.getElementById('prompt');
  const prompt=p.value.trim();
  if(!prompt)return;
  
  addMsg(prompt,'user');
  history.push('User: '+prompt);
  p.value='';p.style.height='auto';
  document.getElementById('sendBtn').disabled=true;
  addMsg('Thinking...','ai');
  
  try{
    const res=await fetch('/api/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,history:history.join('\n'),eduName,eduLevel,eduClass})
    });
    const data=await res.json();
    document.querySelector('#chat .ai:last-child').remove();
    addMsg(data.reply,'ai');
    history.push('AI: '+data.reply);
  }catch(e){
    document.querySelector('#chat .ai:last-child').remove();
    addMsg('Connection error. Check your internet and try again.','ai');
  }
  document.getElementById('sendBtn').disabled=false;
}

function startVoice(){
  const rec=new webkitSpeechRecognition();
  rec.lang='en-KE';
  rec.onstart=()=>{document.getElementById('micBtn').textContent='🔴'};
  rec.onend=()=>{document.getElementById('micBtn').textContent='🎤'};
  rec.onresult=e=>{
    document.getElementById('prompt').value=e.results[0][0].transcript;
    sendMsg();
  };
  rec.start();
}

function reset(){
  localStorage.clear();
  location.reload();
}

document.getElementById('prompt').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}
});

addMsg(`Hello ${eduName}! I'm Eduhub AI for ${eduLevel} ${eduClass}. 

I can teach **all subjects**: Math, Biology, Physics, Chemistry, Geography, History, French, German, ICT, Business.

**Ask me to:**
1. Solve problems step-by-step with LaTeX: $$x = \\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$
2. Draw diagrams: "draw cell diagram" or "show water cycle"
3. Play cartoon videos: "show me video on photosynthesis" 
4. Create notes: "make notes on French verbs"
5. Teach courses: "teach me Form 3 Biology"

How can I help you today?`,'ai');
</script>
</body>
</html>
