<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zimora — Learn. Grow. Achieve.</title>
<link rel="icon" type="image/png" href="zimora-logo.png">
<link rel="apple-touch-icon" href="zimora-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="auth">
<div id="app">

  <section id="splash" class="screen active">
    <div class="stars"></div>
    <img class="zimora-logo" src="zimora-logo.png" alt="Zimora">
    <div class="tagline">LEARN &nbsp;•&nbsp; GROW &nbsp;•&nbsp; ACHIEVE</div>
    <div class="progress-track" role="status" aria-label="Loading">
      <div class="progress-fill"></div>
    </div>
    <div class="loading-text">LOADING…</div>
  </section>

  <section id="auth" class="screen">
    <div class="auth-header">
      <img class="zimora-logo" src="zimora-logo.png" alt="Zimora">
      <h1>Welcome to Zimora</h1>
      <p>YOUR FUTURE, OUR MISSION</p>
    </div>
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" id="tabSignIn" type="button">Sign In</button>
        <button class="tab" id="tabSignUp" type="button">Sign Up</button>
      </div>

      <form id="formSignIn">
        <div class="field">
          <label for="siEmail">Email</label>
          <input type="email" id="siEmail" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="siPassword">Password</label>
          <input type="password" id="siPassword" autocomplete="current-password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-primary" id="btnSignIn">
          <span class="btn-label">Sign In</span>
        </button>
        <div class="auth-msg" id="siMsg"></div>
      </form>

      <form id="formSignUp" style="display:none;">
        <div class="field">
          <label for="suName">Full name</label>
          <input type="text" id="suName" autocomplete="name" required placeholder="Your full name">
        </div>
        <div class="field">
          <label for="suLevel">Level</label>
          <select id="suLevel" required>
            <option value="">Select your level</option>
            <option>PP1</option><option>PP2</option>
            <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
            <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
            <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
            <option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option>
            <option>University</option>
          </select>
        </div>
        <div class="field">
          <label for="suEmail">Email</label>
          <input type="email" id="suEmail" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="suPassword">Password</label>
          <input type="password" id="suPassword" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-primary" id="btnSignUp">
          <span class="btn-label">Create Account</span>
        </button>
        <div class="auth-msg" id="suMsg"></div>
      </form>

      <p class="fine-print">By continuing you agree to Zimora's Terms and acknowledge our Privacy Policy. Your password is encrypted and never stored in plain text.</p>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
